name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "{{PYTHON_VERSION}}"
      - run: bash .claude/hooks/guardrails.sh --ci

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "{{BACKEND_PATH}}"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install {{PYTHON_VERSION}}
      - run: uv sync
      - run: "{{LINT_BACKEND_CMD}}"
      - run: "{{TYPE_BACKEND_CMD}}"
      - run: "{{TEST_BACKEND_CMD}}"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "{{FRONTEND_PATH}}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "{{FRONTEND_PATH}}/package-lock.json"
      - run: npm ci
      - run: "{{LINT_FRONTEND_CMD}}"
      - run: "{{TYPE_FRONTEND_CMD}}"
      - run: "{{TEST_FRONTEND_CMD}}"
