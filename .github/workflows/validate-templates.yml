name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  system:
    name: System layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Render into a temp home
        run: |
          rm -rf /tmp/syshome
          bash system/install.sh --home /tmp/syshome --dev-root /tmp/dev \
            --machine-label ci --all --no-tools
          test -f /tmp/syshome/.config/zsh/zshenv
          test -f /tmp/syshome/.config/zsh/conf.d/98-machine.zsh
          test -f /tmp/syshome/.config/opencode/AGENTS.md
          test -f /tmp/syshome/.claude/settings.json
          test -f /tmp/syshome/.config/system/gitconfig
          test -x /tmp/syshome/.local/bin/zed-wait

      - name: Validate rendered system layer
        run: |
          fail=0
          for f in $(find /tmp/syshome -type f \( -name '*.zsh' -o -name 'zshenv' -o -name 'zprofile' -o -name 'zshrc' -o -name 'profile' \)); do
            zsh -n "$f" || { echo "INVALID ZSH: $f"; fail=1; }
          done
          for f in $(find /tmp/syshome -type f \( -name '*.json' -o -name '*.jsonc' \)); do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID JSON: $f"; fail=1; }
          done
          if grep -rn '{{[A-Z_]*}}' /tmp/syshome; then
            echo "FAIL: unrendered placeholders in the system layer"
            fail=1
          fi
          exit "$fail"

  templates:
    name: Harness / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mcp, python, agent, web, godot]
    env:
      RENDER: /tmp/render-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip
          pip install -q --user pyyaml

      - name: Validate tracked JSON, YAML, shell and Python
        run: |
          fail=0
          for f in $(git ls-files '*.json'); do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID JSON: $f"; fail=1; }
          done
          for f in $(git ls-files '*.yml' '*.yaml'); do
            python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID YAML: $f"; fail=1; }
          done
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "INVALID SHELL: $f"; fail=1; }
          done
          python3 -m py_compile templates/scripts/*.py || fail=1
          exit "$fail"

      - name: Render the ${{ matrix.profile }} harness
        run: |
          rm -rf "$RENDER"
          extra=()
          if [[ "${{ matrix.profile }}" == "agent" ]]; then
            extra=(--has-mlflow yes --has-langgraph yes)
          fi
          bash templates/scripts/bootstrap.sh \
            --profile "${{ matrix.profile }}" \
            --project-name "Validate${{ matrix.profile }}" \
            --project-slug "validate-${{ matrix.profile }}" \
            "${extra[@]}" \
            --output-dir "$RENDER"

      - name: Check harness contract
        run: |
          set -e
          grep -q '@AGENTS.md' "$RENDER/CLAUDE.md"
          grep -q '### Rule Index\|## Rule Index' "$RENDER/AGENTS.md"
          grep -q 'my-workflows.md' "$RENDER/AGENTS.md"
          ! grep -q '.claude/rules' "$RENDER/.opencode/opencode.json"
          ! grep -rq '^permission:' "$RENDER/.opencode/agents"
          grep -Rq '^permissions:' "$RENDER/.opencode/agents"
          ! grep -rqi 'copilot' "$RENDER"

      - name: Check rule index is complete
        run: |
          rules=$(find "$RENDER/.claude/rules" -name '*.md' -not -path '*/doctrine/*' | wc -l | tr -d ' ')
          rows=$(grep -c '^| `\.claude/rules/' "$RENDER/AGENTS.md" || true)
          echo "rules=$rules index_rows=$rows"
          [[ "$rules" == "$rows" ]]

      - name: Check profile isolation
        run: |
          fail=0
          case "${{ matrix.profile }}" in
            mcp)
              test -f "$RENDER/.claude/rules/mcp-contract.md" || fail=1
              test -f "$RENDER/.claude/rules/mcp-transport.md" || fail=1
              test ! -e "$RENDER/.claude/rules/rate-limiting.md" || fail=1
              test ! -e "$RENDER/.claude/rules/frontend" || fail=1
              test ! -e "$RENDER/.claude/agents/frontend-architect.md" || fail=1
              test ! -e "$RENDER/.claude/commands/migration-check.md" || fail=1
              ;;
            python)
              test -f "$RENDER/.claude/rules/cli.md" || fail=1
              test -f "$RENDER/.claude/rules/packaging.md" || fail=1
              test ! -e "$RENDER/.claude/rules/mcp-contract.md" || fail=1
              test ! -e "$RENDER/.claude/rules/api-design.md" || fail=1
              test ! -e "$RENDER/.claude/agents/frontend-architect.md" || fail=1
              ;;
            agent)
              test -f "$RENDER/.claude/rules/agent-system.md" || fail=1
              test -f "$RENDER/.claude/rules/agentic-workflow.md" || fail=1
              test ! -e "$RENDER/.claude/rules/mcp-contract.md" || fail=1
              test ! -e "$RENDER/.claude/agents/frontend-architect.md" || fail=1
              ;;
            web)
              test -f "$RENDER/.claude/rules/api-design.md" || fail=1
              test -f "$RENDER/.claude/rules/frontend/conventions.md" || fail=1
              test -f "$RENDER/.claude/rules/database/sql-standards.md" || fail=1
              test -f "$RENDER/.claude/agents/frontend-architect.md" || fail=1
              test -f "$RENDER/.claude/commands/migration-check.md" || fail=1
              test ! -e "$RENDER/.claude/rules/mcp-contract.md" || fail=1
              ;;
            godot)
              test -f "$RENDER/.claude/rules/godot-serialization.md" || fail=1
              test -f "$RENDER/.claude/rules/godot-testing.md" || fail=1
              test ! -e "$RENDER/.claude/rules/cli.md" || fail=1
              test ! -e "$RENDER/.claude/rules/mcp-contract.md" || fail=1
              test ! -e "$RENDER/.claude/agents/frontend-architect.md" || fail=1
              ;;
          esac
          exit "$fail"

      - name: Check required files and hooks
        run: |
          fail=0
          for f in AGENTS.md CLAUDE.md .claude/settings.json .opencode/opencode.json \
                   .claude/rules/architecture.md .claude/rules/testing.md \
                   .claude/commands/graphify.md .opencode/commands/graphify.md \
                   .claude/commands/ship-pr.md .opencode/commands/ship-pr.md \
                   .claude/skills/ship-pr/SKILL.md .opencode/skills/ship-pr/SKILL.md \
                   .claude/skills/ship-pr/scripts/watch_pr.py \
                   .claude/hooks/check-primitive-drift.sh \
                   .claude/skills/customize-harness/SKILL.md \
                   .opencode/skills/customize-harness/SKILL.md; do
            test -f "$RENDER/$f" || { echo "MISSING: $f"; fail=1; }
          done
          for h in "$RENDER"/.claude/hooks/*.sh; do
            bash -n "$h" || { echo "INVALID HOOK: $h"; fail=1; }
          done
          exit "$fail"

      - name: Check OpenCode agent/command mirrors
        run: |
          fail=0
          for kind in agents commands; do
            for cf in "$RENDER/.claude/$kind"/*.md; do
              [[ -f "$cf" ]] || continue
              rel="${cf#"$RENDER/.claude/$kind/"}"
              of="$RENDER/.opencode/$kind/$rel"
              test -f "$of" || { echo "MISSING mirror: $kind/$rel"; fail=1; continue; }
              cb=$(awk '/^---$/{if (++c == 2) nextfile} c >= 2' "$cf")
              ob=$(awk '/^---$/{if (++c == 2) nextfile} c >= 2' "$of")
              [[ "$cb" == "$ob" ]] || { echo "DRIFT: $kind/$rel"; fail=1; }
            done
          done
          exit "$fail"

      - name: Check rendered JSON and placeholders
        run: |
          fail=0
          for f in $(find "$RENDER" -name '*.json' -type f); do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID RENDERED JSON: $f"; fail=1; }
          done
          if grep -rn '{{[A-Z_]*}}' "$RENDER"; then
            echo "FAIL: orphaned placeholders"
            fail=1
          fi
          exit "$fail"

      - name: Cross-harness sync
        run: python3 templates/scripts/check-harness-sync.py templates "$RENDER"

      - name: Check file count
        run: |
          total=$(find "$RENDER" -type f | wc -l | tr -d ' ')
          echo "rendered $total files"
          [[ "$total" -ge 40 ]]
