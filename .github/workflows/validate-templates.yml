name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Template System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip sed grep zsh
          pip install -q --user yq pyyaml

      - name: Validate tracked JSON and YAML
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID JSON: $f"; fail=1; }
          done < <(git ls-files '*.json')
          while IFS= read -r f; do
            python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID YAML: $f"; fail=1; }
          done < <(git ls-files '*.yml' '*.yaml')
          exit "$fail"

      - name: Validate shell and Python syntax
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "INVALID SHELL: $f"; fail=1; }
          done < <(git ls-files '*.sh')
          python3 -m py_compile templates/scripts/*.py || fail=1
          exit "$fail"

      - name: Render the system layer into a temp home
        run: |
          rm -rf /tmp/syshome
          bash system/install.sh --home /tmp/syshome --dev-root /tmp/dev \
            --machine-label ci --all --no-tools
          test -f /tmp/syshome/.config/zsh/zshenv
          test -f /tmp/syshome/.config/zsh/conf.d/98-machine.zsh
          test -f /tmp/syshome/.config/opencode/AGENTS.md
          test -f /tmp/syshome/.claude/settings.json
          test -f /tmp/syshome/.config/system/gitconfig
          test -x /tmp/syshome/.local/bin/zed-wait

      - name: Validate the rendered system layer
        run: |
          fail=0
          while IFS= read -r f; do
            zsh -n "$f" || { echo "INVALID ZSH: $f"; fail=1; }
          done < <(find /tmp/syshome -type f \( -name '*.zsh' -o -name 'zshenv' -o -name 'zprofile' -o -name 'zshrc' -o -name 'profile' \))
          while IFS= read -r f; do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID JSON: $f"; fail=1; }
          done < <(find /tmp/syshome -type f \( -name '*.json' -o -name '*.jsonc' \))
          if grep -rn '{{[A-Z_]*}}' /tmp/syshome; then
            echo "FAIL: unrendered placeholders in the rendered system layer"
            fail=1
          fi
          exit "$fail"

      - name: Render templates to temp directory
        run: |
          bash templates/scripts/bootstrap.sh \
            --project-name "ValidateTest" \
            --project-slug "validatetest" \
            --backend-path "backend" \
            --frontend-path "frontend" \
            --repo-org "testorg" \
            --repo-name "validatetest" \
            --db-provider "supabase" \
            --state-manager "zustand" \
            --python-version "3.12" \
            --fastapi-version "0.119+" \
            --react-version "19" \
            --typescript-version "5.9" \
            --vite-version "7.3" \
            --pkg-manager-backend "uv" \
            --pkg-manager-frontend "npm" \
            --coverage-aggregate-backend "70" \
            --coverage-aggregate-frontend "60" \
            --calver-version "$(date +%Y.%m.%d)" \
            --article-i-services "auth_manager, analytics_engine, content_manager" \
            --frontend-stores "auth, analytics, content" \
            --db-extensions "pgvector, pgmq, HSTORE" \
            --has-mlflow "yes" \
            --has-langgraph "yes" \
            --cicd-platform "github-actions" \
            --e2e-tool "playwright" \
            --ui-library "shadcn/ui" \
            --tailwind "yes" \
            --zod-validation "yes" \
            --custom-instructions "Custom rule 1\nCustom rule 2" \
            --output-dir "/tmp/validate-render"

      - name: Check harness loading contract
        run: |
          grep -q '@AGENTS.md' /tmp/validate-render/CLAUDE.md
          grep -q 'Rule Index' /tmp/validate-render/AGENTS.md
          grep -q 'my-workflows.md' /tmp/validate-render/AGENTS.md
          ! grep -q '.claude/rules' /tmp/validate-render/.opencode/opencode.json
          ! grep -rq 'npx graphify' /tmp/validate-render/.opencode
          ! grep -Rq '^permission:' /tmp/validate-render/.opencode/agents
          grep -Rq '^permissions:' /tmp/validate-render/.opencode/agents
          test -f /tmp/validate-render/.opencode/commands/graphify.md
          test -f /tmp/validate-render/.claude/commands/graphify.md

      - name: Check rendered JSON is valid
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID RENDERED JSON: $f"; fail=1; }
          done < <(find /tmp/validate-render -type f -name '*.json')
          exit "$fail"

      - name: Check zero orphaned placeholders
        run: |
          orphans=$(grep -ro '{{[A-Z_]*}}' /tmp/validate-render | sort | uniq -c)
          if [[ -n "$orphans" ]]; then
            echo "FAIL: Found orphaned placeholders:"
            echo "$orphans"
            exit 1
          fi
          echo "PASS: Zero orphaned placeholders"

      - name: Check MLflow section present when enabled
        run: |
          count=$(grep -c 'Prompt Registry' /tmp/validate-render/.claude/rules/backend/architecture.md || true)
          if [[ "$count" -lt 1 ]]; then
            echo "FAIL: MLflow Prompt Registry section missing from architecture.md (has-mlflow=yes)"
            exit 1
          fi
          echo "PASS: MLflow Prompt Registry section present in architecture.md"

      - name: Check mirror sync
        run: |
          python3 templates/scripts/generate-copilot-mirrors.py /tmp/validate-render
          
          # Verify all Claude rules have Copilot mirrors
          for claude_file in /tmp/validate-render/.claude/rules/**/*.md; do
            [[ -f "$claude_file" ]] || continue
            rel="${claude_file#/tmp/validate-render/.claude/rules/}"
            # Doctrine is referenced by articles/agents and is not mirrored to Copilot.
            [[ "$rel" == doctrine/* ]] && continue
            mirror="/tmp/validate-render/.github/instructions/${rel//\//-}"
            mirror="${mirror%.md}.instructions.md"
            if [[ ! -f "$mirror" ]]; then
              echo "FAIL: Mirror missing for $rel"
              exit 1
            fi
          done
          echo "PASS: All Copilot mirrors generated"

      - name: Check mirror body identity
        run: |
          diffs=0
          for claude_file in /tmp/validate-render/.claude/rules/**/*.md; do
            [[ -f "$claude_file" ]] || continue
            rel="${claude_file#/tmp/validate-render/.claude/rules/}"
            [[ "$rel" == doctrine/* ]] && continue
            mirror="/tmp/validate-render/.github/instructions/${rel//\//-}.instructions.md"
            [[ -f "$mirror" ]] || continue
            
            # Extract body (after second ---)
            claude_body=$(awk '/^---$/{if (++count == 2) nextfile} count >= 2' "$claude_file")
            mirror_body=$(awk '/^---$/{if (++count == 2) nextfile} count >= 2' "$mirror")
            
            if [[ "$claude_body" != "$mirror_body" ]]; then
              echo "DRIFT: $rel"
              diffs=$((diffs + 1))
            fi
          done
          
          if [[ $diffs -gt 0 ]]; then
            echo "FAIL: $diffs mirror pair(s) have drifted"
            exit 1
          fi
          echo "PASS: All mirror bodies identical"

      - name: Check hook syntax
        run: |
          errors=0
          for hook in /tmp/validate-render/.claude/hooks/*.sh; do
            [[ -f "$hook" ]] || continue
            if ! bash -n "$hook"; then
              echo "FAIL: Syntax error in $hook"
              errors=$((errors + 1))
            fi
          done
          
          if [[ $errors -gt 0 ]]; then
            exit 1
          fi
          echo "PASS: All hooks have valid syntax"

      - name: Check key files exist
        run: |
          files=(
            "CLAUDE.md"
            "AGENTS.md"
            ".github/copilot-instructions.md"
            ".claude/rules/backend/architecture.md"
            ".claude/rules/backend/testing.md"
            ".claude/rules/backend/error-handling.md"
            ".claude/rules/backend/async-patterns.md"
            ".claude/rules/backend/api-design.md"
            ".claude/rules/backend/security.md"
            ".claude/rules/enforcement.md"
            ".claude/rules/workflow.md"
            ".claude/rules/database/sql-standards.md"
            ".claude/rules/frontend/conventions.md"
            ".claude/hooks/check-no-skipped-tests.sh"
            ".claude/hooks/check-primitive-drift.sh"
            ".claude/skills/gen-contract-test/SKILL.md"
            ".opencode/skills/gen-contract-test/SKILL.md"
            ".opencode/opencode.json"
            ".claude/settings.json"
          )
          
          missing=0
          for f in "${files[@]}"; do
            if [[ ! -f "/tmp/validate-render/$f" ]]; then
              echo "FAIL: Missing required file: $f"
              missing=$((missing + 1))
            fi
          done
          
          if [[ $missing -gt 0 ]]; then
            find /tmp/validate-render -type f | sort
            exit 1
          fi
          echo "PASS: All required files present"

      - name: Check template file count sanity
        run: |
          total=$(find /tmp/validate-render -type f | wc -l | tr -d ' ')
          if [[ "$total" -lt 50 ]]; then
            echo "FAIL: Expected at least 50 files, got $total"
            find /tmp/validate-render -type f | sort
            exit 1
          fi
          echo "PASS: Generated $total files"

      - name: Check script executability
        run: |
          if [[ ! -x templates/scripts/bootstrap.sh ]]; then
            chmod +x templates/scripts/bootstrap.sh
          fi
          if [[ ! -x templates/scripts/generate-copilot-mirrors.py ]]; then
            chmod +x templates/scripts/generate-copilot-mirrors.py
          fi
          if [[ ! -x templates/scripts/process-conditionals.py ]]; then
            chmod +x templates/scripts/process-conditionals.py
          fi
          if [[ ! -x templates/scripts/check-harness-sync.py ]]; then
            chmod +x templates/scripts/check-harness-sync.py
          fi
          echo "PASS: Scripts executable"

      - name: Run cross-harness sync check
        run: |
          python3 templates/scripts/check-harness-sync.py templates /tmp/validate-render

      - name: Final summary
        run: |
          echo ""
          echo "=== Validation Complete ==="
          echo "Project: ValidateTest"
          echo "Files:   $(find /tmp/validate-render -type f | wc -l) generated"
          echo "Status:  ALL CHECKS PASSED"
