name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  system:
    name: System layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for secrets
        run: python3 templates/claude-code/.claude/hooks/check-secrets.py --all

      - name: Typecheck local OpenCode plugin
        run: |
          cd .opencode
          npm ci --ignore-scripts --silent
          npx --yes -p typescript@5.9.3 tsc --noEmit --skipLibCheck \
            --moduleResolution bundler --module esnext --target es2022 \
            plugins/warn-pointer-edit.ts

      - name: Install shell
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Render into a temp home
        run: |
          rm -rf /tmp/syshome
          bash system/install.sh --home /tmp/syshome --dev-root /tmp/dev \
            --machine-label ci --all --no-tools
          test -f /tmp/syshome/.config/zsh/zshenv
          test -f /tmp/syshome/.config/zsh/conf.d/98-machine.zsh
          test -f /tmp/syshome/.config/opencode/AGENTS.md
          test -f /tmp/syshome/.claude/settings.json
          test -f /tmp/syshome/.config/system/gitconfig
          test -x /tmp/syshome/.local/bin/zed-wait
          test -x /tmp/syshome/.local/bin/graphify-gdscript
          bash -n system/bin/graphify-gdscript

      - name: Scaffold a new project
        run: |
          rm -rf /tmp/scaffold
          ./new-project.sh /tmp/scaffold --stacks python \
            --project-name "Scaffold" --project-slug scaffold --scaffold --no-hooks
          test -f /tmp/scaffold/pyproject.toml
          test -f /tmp/scaffold/src/scaffold/__init__.py
          test -f /tmp/scaffold/Makefile
          python3 /tmp/scaffold/.claude/hooks/check-project-drift.py --root /tmp/scaffold

      - name: Guardrail regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/tmp/scaffold/AGENTS.md")
          lines = [line for line in path.read_text().splitlines()
                   if ".claude/rules/testing.md" not in line]
          path.write_text("\n".join(lines) + "\n")
          PY
          if python3 /tmp/scaffold/.claude/hooks/check-project-drift.py \
              --root /tmp/scaffold --quiet; then
            echo "drift gate accepted a broken rule index"
            exit 1
          fi

          token="ghp_$(printf 'a%.0s' {1..36})"
          printf 'TOKEN=%s\n' "$token" > /tmp/scaffold/leak.txt
          if python3 /tmp/scaffold/.claude/hooks/check-secrets.py /tmp/scaffold/leak.txt; then
            echo "secret gate accepted a GitHub token"
            exit 1
          fi

      - name: Validate rendered system layer
        run: |
          fail=0
          for f in $(find /tmp/syshome -type f \( -name '*.zsh' -o -name 'zshenv' -o -name 'zprofile' -o -name 'zshrc' -o -name 'profile' \)); do
            zsh -n "$f" || { echo "INVALID ZSH: $f"; fail=1; }
          done
          for f in $(find /tmp/syshome -type f \( -name '*.json' -o -name '*.jsonc' \)); do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID JSON: $f"; fail=1; }
          done
          if grep -rn '{{[A-Z_]*}}' /tmp/syshome; then
            echo "FAIL: unrendered placeholders in the system layer"
            fail=1
          fi
          exit "$fail"

  templates:
    name: Harness / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: python, stacks: python, packs: "" }
          - { name: mcp, stacks: mcp, packs: "" }
          - { name: agent+acd, stacks: agent, packs: acd }
          - { name: web+production, stacks: "fastapi,frontend", packs: production }
          - { name: full-web, stacks: "mcp,agent,fastapi,frontend", packs: "production,acd" }
          - { name: godot+rust, stacks: "godot,rust", packs: "" }
          - { name: godot-mcp, stacks: "mcp,godot-addon", packs: "" }
    env:
      RENDER: /tmp/render
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -q --user pyyaml

      - name: Validate tracked JSON, YAML, shell and Python
        run: |
          fail=0
          for f in $(git ls-files '*.json'); do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID JSON: $f"; fail=1; }
          done
          for f in $(git ls-files '*.yml' '*.yaml' | grep -v '^templates/_shared/ci/'); do
            python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' "$f" \
              || { echo "INVALID YAML: $f"; fail=1; }
          done
          for f in $(git ls-files '*.sh') templates/_shared/githooks/*; do
            bash -n "$f" || { echo "INVALID SHELL: $f"; fail=1; }
          done
          python3 -m py_compile templates/scripts/*.py \
            templates/claude-code/.claude/hooks/*.py || fail=1
          git ls-files 'templates/_shared/**/*.py' '.agents/scripts/*.py' \
            | xargs -r python3 -m py_compile || fail=1
          python3 scripts/lint-skills.py || fail=1
          exit "$fail"

      - name: Render ${{ matrix.name }}
        run: |
          rm -rf "$RENDER"
          python3 templates/scripts/render.py --output-dir "$RENDER" \
            --project-name "Validate" --stacks "${{ matrix.stacks }}" --packs "${{ matrix.packs }}"

      - name: Check harness contract
        run: |
          set -e
          grep -q '@AGENTS.md' "$RENDER/CLAUDE.md"
          grep -q '## Rule Index' "$RENDER/AGENTS.md"
          ! grep -q '.claude/rules' "$RENDER/.opencode/opencode.json"
          ! grep -rq '^permission:' "$RENDER/.opencode/agents"
          grep -Rq '^permissions:' "$RENDER/.opencode/agents"
          ! grep -rqi 'copilot' "$RENDER"
          ! grep -rqE '\{\{[#/]?[A-Z_]+\}\}' "$RENDER"
          python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' "$RENDER/.github/workflows/ci.yml"
          for f in $(find "$RENDER" -name '*.json' -type f); do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f"
          done
          for h in "$RENDER"/.claude/hooks/*.sh; do bash -n "$h"; done

      - name: Check OpenCode mirrors
        run: |
          fail=0
          for kind in agents commands; do
            for cf in "$RENDER/.claude/$kind"/*.md; do
              [[ -f "$cf" ]] || continue
              rel="${cf#"$RENDER/.claude/$kind/"}"
              of="$RENDER/.opencode/$kind/$rel"
              test -f "$of" || { echo "MISSING mirror: $kind/$rel"; fail=1; continue; }
              cb=$(awk 'c >= 2 {print} /^---$/ {c++}' "$cf")
              ob=$(awk 'c >= 2 {print} /^---$/ {c++}' "$of")
              [[ -n "$cb" ]] || { echo "EMPTY body: $kind/$rel"; fail=1; }
              [[ "$cb" == "$ob" ]] || { echo "DRIFT: $kind/$rel"; fail=1; }
            done
          done
          exit "$fail"

      - name: Cross-harness sync
        run: python3 templates/scripts/check-harness-sync.py templates "$RENDER"

      - name: Project drift guard (includes stack/pack isolation)
        run: python3 "$RENDER/.claude/hooks/check-project-drift.py" --root "$RENDER"

      - name: Isolation regression
        run: |
          touch "$RENDER/.claude/rules/rust.md"
          if [[ ",${{ matrix.stacks }}," != *",rust,"* ]] && \
             python3 "$RENDER/.claude/hooks/check-project-drift.py" --root "$RENDER" --quiet; then
            echo "drift gate accepted a rule from an undeclared stack"
            exit 1
          fi
